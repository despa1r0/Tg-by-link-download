name: CI

on:
  push:
    branches:
      - master
      - develop
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate, lint, and test (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "ruff==0.16.8"

      - name: Validate Python and Compose configuration
        run: |
          python -m compileall -q bot tests
          cp .env.example .env
          docker compose --profile discord config --quiet
          python -c 'import bot.services.media_model, bot.main, bot.discord_app.main'
          expected_image="ghcr.io/example/tg-by-link-download:test"
          BOT_IMAGE="$expected_image" docker compose --profile discord config --images |
            grep -Fx -- "$expected_image"
          BOT_IMAGE="$expected_image" docker compose --profile discord config --format json |
            python -c 'import json, sys; services=json.load(sys.stdin)["services"]; assert {"bot", "discord"} <= services.keys(); assert all("container_name" not in services[name] for name in ("bot", "discord")); assert services["discord"]["command"] == ["python", "-m", "bot.discord_app.main"]'

      - name: Lint
        run: ruff check bot tests

      - name: Run tests
        run: python -m unittest discover -s tests -v
