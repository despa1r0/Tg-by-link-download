services:
  bot:
    image: ${BOT_IMAGE:-tg-media-bot:local}
    build: .
    container_name: tg_media_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./downloads:/app/downloads
      # Uncomment when YTDLP_COOKIES_FILE=/app/secrets/cookies.txt is configured.
      # - ./cookies.txt:/app/secrets/cookies.txt:ro
